// AndroidX Preference renders res/xml/preferences.xml with PreferenceFragmentCompat.
// Override the version from App_Resources/Android/before-plugins.gradle:
//   project.ext { androidXPreference = "1.2.1" }
dependencies {
    def preferenceVersion = project.hasProperty("androidXPreference") ? project.androidXPreference : "1.2.1"
    implementation "androidx.preference:preference:$preferenceVersion"
}
