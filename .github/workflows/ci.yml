name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
        working-directory: src
      - run: npm run build
        working-directory: src
      - run: npm pack --dry-run
        working-directory: src
